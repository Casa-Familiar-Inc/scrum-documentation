<p><em>Análisis de Integridad:</em> Se sugiere obligar el Control de Versiones en esta biblioteca para evitar sobreescrituras accidentales de contratos, y aplicar <em>Retention Labels</em> nativos desde el Compliance Center para que &quot;Contracts and Permits&quot; no puedan borrarse por al menos 5 años (para auditoría fiscal de Non-Profit).</p>
<h1 id="flujos-de-trabajo-y-ciclo-de-vida-del-evento-extendido-1">Flujos de Trabajo y Ciclo de Vida del Evento (Extendido)</h1>
<p>A continuación se presentan los diagramas de ciclo de vida con un enfoque profundo en el manejo de excepciones y el archivado robusto.</p>
<h2 id="1-ciclo-de-vida-de-tareas-event-task-1">1. Ciclo de Vida de Tareas (Event Task)</h2>
<p>Gestiona las asignaciones y los posibles cuellos de botella (bloqueos y escalaciones).</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-mermaid">stateDiagram-v2
    [*] --&gt; Pending : Creación Manual/Automática
    Pending --&gt; InProgress : La persona asignada inicia el trabajo
    InProgress --&gt; Blocked : Existe un Problema/Dependencia
    Blocked --&gt; InProgress : Bloqueo resuelto
    Blocked --&gt; Escalated : Si no se resuelve en 48h (Automático)
    Escalated --&gt; InProgress : Intervención del Lead
    InProgress --&gt; Completed : Trabajo finalizado
    Pending --&gt; Cancelled : Tarea descartada (Con justificación)
    Completed --&gt; [*]
    Cancelled --&gt; [*]
</code></pre>
<h2 id="2-proceso-de-rollover-anual-rotaci%C3%B3n-de-comit%C3%A9-y-archivados-1">2. Proceso de Rollover Anual (Rotación de Comité y Archivados)</h2>
<p>Dado que los comités cambian cada año, el rollover no puede simplemente asignar tareas a las mismas personas. El ciclo se centra en &quot;limpiar responsabilidades&quot; y despejar el tablero para el nuevo comité.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-mermaid">sequenceDiagram
    participant AD as M365 Admin (Entra ID)
    participant Lead as Comité Lead Entrante/Saliente
    participant SP as SharePoint (Listas)
    participant PA as Power Automate

    Lead-&gt;&gt;SP: Finaliza el evento (Tareas en estado Completed/Cancelled)
    Note over SP: Las tareas históricas permanecen &quot;congeladas&quot; bajo la columna [Year]
    Lead-&gt;&gt;AD: Elimina a los miembros del comité viejo del M365 Group
    Lead-&gt;&gt;AD: Agrega a los miembros del comité nuevo al M365 Group
    Lead-&gt;&gt;SP: Actualiza la lista &quot;Committee Roster&quot; con nuevos miembros y el New Year
    Lead-&gt;&gt;PA: Ejecuta el flujo &quot;Prepare Next Year&quot; (Botón de Flujo)
    PA-&gt;&gt;SP: Extrae las &quot;Master Tasks&quot; (ej: &quot;Get City Hall Permit&quot;, &quot;Table Rentals&quot;)
    PA-&gt;&gt;SP: Genera nuevas tareas asignando [Year] = Next Year (Status = Pending)
    Note over PA: CRÍTICO: La columna 'Assigned To' en las nuevas tareas se deja VACÍA.
    SP--&gt;&gt;Lead: El tablero está limpio. El nuevo Lead puede comenzar a asignar tareas al nuevo comité.
</code></pre>
<h2 id="3-flujo-de-notificaciones-y-acuerdo-de-nivel-de-servicio-sla-1">3. Flujo de Notificaciones y Acuerdo de Nivel de Servicio (SLA)</h2>
<p>Para evitar la saturación de correos electrónicos, el flujo incorpora verificaciones de tiempo (Recurrencia Diaria) en Power Automate en lugar de notificaciones instantáneas para todo.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-mermaid">flowchart TD
    A[&quot;Trigger: Recurrencia Diaria (8:00 AM)&quot;] --&gt; B[&quot;Obtener tareas 'In Progress' o 'Pending'&quot;]
    B --&gt; C{&quot;¿Vence en &lt; 3 días?&quot;}
    C -- &quot;Sí&quot; --&gt; E[&quot;Añadir al Resumen Diario&quot;]
    C -- &quot;No&quot; --&gt; D{&quot;¿Está Bloqueada?&quot;}
    D -- &quot;Sí&quot; --&gt; E
    D -- &quot;No&quot; --&gt; F[&quot;Siguiente tarea&quot;]
    E --&gt; F
    F --&gt; G{&quot;¿Quedan más tareas?&quot;}
    G -- &quot;Sí&quot; --&gt; C
    G -- &quot;No&quot; --&gt; H{&quot;¿Resumen vacío?&quot;}
    H -- &quot;No&quot; --&gt; I[&quot;Enviar mensaje en Teams (Canal Comité)&quot;]
    H -- &quot;Sí&quot; --&gt; J[&quot;Fin del Flujo&quot;]
    I --&gt; J
</code></pre>
<p><em>Análisis Operativo:</em> Un Resumen Diario es infinitamente mejor para la <em>Gobernanza</em> que disparar un correo por cada elemento de lista creado. Ayuda a mantener la tranquilidad del comité y aumenta la probabilidad de que las alertas sean leídas y atendidas.</p>
<h1 id="gu%C3%ADa-maestra-de-implementaci%C3%B3n-sistema-casa-familiar-events-1">Guía Maestra de Implementación: Sistema &quot;Casa Familiar Events&quot;</h1>
<p>Esta es la guía definitiva para implementar y administrar el ecosistema de sitios de eventos. El sistema está diseñado en la <strong>Experiencia Moderna de SharePoint</strong> (Modern Experience).</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-marpit-fragments="6" lang="en-US">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-marpit-fragments="2" lang="en-US">
<h1 id="plan-de-implementaci%C3%B3n-del-sitio-extendido-1">Plan de Implementación del Sitio (Extendido)</h1>
<p>Este plan cubre todo desde la configuración inicial hasta el plan de gobernanza y adopción de usuarios (Change Management).</p>
<blockquote>
<p>[!NOTE]<br />
<strong>¿Requiere Desarrollo?</strong><br />
El grueso de esta arquitectura es <strong>Configuración Out-of-the-Box (OOTB)</strong> (haciendo clic en la interfaz de SharePoint).<br />
NO se requiere programación tradicional (como React o C#).<br />
Sin embargo, incluye ligeras cargas de <strong>Low-Code/Scripting</strong> (marcadas con la etiqueta [LOW-CODE]) en dos áreas:</p>
<ol>
<li>Power Automate: Para conectar flujos lógicos (arrastrar y soltar bloques condicionales).</li>
<li>JSON/PnP PowerShell: Para automatizar la creación de sitios en lugar de hacerlo de forma manual e iterativa.</li>
</ol>
</blockquote>
<h2 id="fase-1-arquitectura-de-hub-y-gobernanza-data-governance-1">Fase 1: Arquitectura de Hub y Gobernanza (Data Governance)</h2>
<ul>
<li>[ ] <strong>1.1. Crear Hub Site:</strong> Crear un Communication Site (&quot;Casa Familiar Events&quot;) y registrarlo. [CONFIGURATION]</li>
<li>[ ] <strong>1.2. Site Columns (Nivel Hub):</strong> Crear tipos de datos CF_TaskStatus, CF_YearCycle, CF_CommitteeRole. [CONFIGURATION]</li>
<li>[ ] <strong>1.3. Content Types (Nivel Hub):</strong> Agrupar Site Columns en Event Task CT y Roster CT, y publicarlos (Content Type Publisher). [CONFIGURATION]</li>
<li>[ ] <strong>1.4. Retention Policies (Compliance Center):</strong> Aplicar políticas de auditoría a las bibliotecas de documentos (vida útil obligatoria de 5 años para contratos). [CONFIGURATION]</li>
</ul>
<h2 id="fase-2-automatizaci%C3%B3n-del-despliegue-de-sitios-desarrollo-ligero-1">Fase 2: Automatización del Despliegue de Sitios (Desarrollo Ligero)</h2>
<ul>
<li>[ ] <strong>2.1. Plantilla (Site Script &amp; Site Design):</strong> [LOW-CODE] Desarrollar scripts JSON y PnP PowerShell que instalen automáticamente las listas (Event Tasks, Risks, Committee Roster, Event Budget) sobre los grupos de M365 creados.</li>
<li>[ ] <strong>2.2. Aprovisionamiento:</strong> [LOW-CODE] Ejecutar el Site Design en los 5 sitios base (Fall Festival, Haunted House...). Esto elimina errores tipográficos al escribir columnas manualmente.</li>
</ul>
<h2 id="fase-3-configuraci%C3%B3n-de-interfaz-y-vistas-nativas-1">Fase 3: Configuración de Interfaz y Vistas Nativas</h2>
<ul>
<li>[ ] <strong>3.1. Formato de Vistas (List Formatting):</strong> [LOW-CODE] Aplicar JSON Formatters (código JSON nativo de SharePoint) para colorear toda la fila de verde si está Completed o de rojo grueso si está Blocked.</li>
<li>[ ] <strong>3.2. Vistas Indexadas:</strong> Crear un índice a nivel de plataforma para la columna CF_YearCycle para prevenir el colapso del sitio a largo plazo (List Threshold de 5,000 elementos). [CONFIGURATION]</li>
<li>[ ] <strong>3.3. Hub Central Dashboard:</strong> Configurar Highlighted Content Webparts en el Hub central para mostrar &quot;Tareas Bloqueadas Recientes&quot;. [CONFIGURATION]</li>
</ul>
<h2 id="fase-4-flujos-operativos-y-notificaciones-plumbing--flow-1">Fase 4: Flujos Operativos y Notificaciones (Plumbing / Flow)</h2>
<ul>
<li>[ ] <strong>4.1. Resumen Diario de Vencimientos:</strong> [LOW-CODE] Programar el &quot;Daily Digest&quot; en Power Automate para verificar tareas vencidas.</li>
<li>[ ] <strong>4.2. Flujo de Rollover Automático:</strong> [LOW-CODE] Crear el flujo maestro que clona tareas críticas del ciclo anterior y prepara al nuevo comité.</li>
</ul>
<h2 id="fase-5-estrategia-de-adopci%C3%B3n-change-management-1">Fase 5: Estrategia de Adopción (Change Management)</h2>
<ul>
<li>[ ] <strong>5.1. Piloto Técnico (UAT):</strong> Probar los flujos con usuarios ficticios en 1 sitio o con el equipo técnico.</li>
<li>[ ] <strong>5.2. Playbook / Manual del Comité:</strong> Crear una WIKI o página dentro del Hub Site llamada &quot;Cómo gestionar mi evento&quot; (capacitación asíncrona para la rotación constante de voluntarios).</li>
<li>[ ] <strong>5.3. Limitación de Daños (Permisos):</strong> Validar que los permisos para el Committee Roster no permitan borrar la lista completa. (Cambiar nivel Contributor -&gt; Nivel de permiso personalizado sin capacidad de borrar listas/elementos).</li>
<li>[ ] <strong>5.4. Go-Live y Soporte Temprano:</strong> Incorporar a los comités reales del año actual e iniciar el soporte de hypercare por 2 a 3 semanas.</li>
</ul>
<h1 id="detalle-t%C3%A9cnico-columnas-de-sitio-modern-sharepoint-1">Detalle Técnico: Columnas de Sitio (Modern SharePoint)</h1>
<blockquote>
<p>[!NOTE]<br />
En la interfaz moderna (<strong>Modern Experience</strong>), algunas configuraciones avanzadas aún requieren acceder al panel de <em>Site Settings</em> tradicional, pero la aplicación de estas columnas a las listas es 100% moderna.</p>
</blockquote>
<h3 id="1-%C2%BFqu%C3%A9-son-las-site-columns-1">1. ¿Qué son las &quot;Site Columns&quot;?</h3>
<p><strong>No son listas.</strong> Imagínalas como los &quot;encabezados&quot; o &quot;categorías&quot; que utilizarás más adelante dentro de tus listas.</p>
<ul>
<li data-marpit-fragment="1"><strong>Una Lista</strong> es como una hoja de Excel (ej: &quot;Lista de Tareas&quot;).</li>
<li data-marpit-fragment="2"><strong>Una Site Column</strong> es la definición del campo (ej: &quot;Estado&quot;) que vive al nivel del sitio para que puedas usarlo en muchas hojas de Excel diferentes sin tener que volver a crearlo.</li>
</ul>
<p>En SharePoint, una <strong>Site Column</strong> es una definición de columna reutilizable. A diferencia de una columna de lista estándar, si cambias la configuración de una Site Column (ej: agregas una nueva opción de estado), el cambio puede propagarse automáticamente a todas las listas que la utilizan.</p>
<h3 id="2-configuraci%C3%B3n-de-las-3-columnas-maestras-paso-a-paso-1">2. Configuración de las 3 Columnas Maestras (Paso a Paso)</h3>
<blockquote>
<p>[!IMPORTANT]<br />
<strong>Ubicación:</strong> Ve siempre a tu <strong>HUB SITE</strong> primero.<br />
Haz clic en el icono del engrane (<strong>Settings</strong> -&gt; <strong>Site information</strong> -&gt; <strong>View all site settings</strong> -&gt; <strong>Site columns</strong> -&gt; <strong>Create</strong>.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-marpit-fragments="9" lang="en-US">
<h4 id="a-columna-cf_taskstatus-1">A. Columna: <code>CF_TaskStatus</code></h4>
<ul>
<li data-marpit-fragment="1"><strong>Nombre de columna:</strong> <code>CF_TaskStatus</code></li>
<li data-marpit-fragment="2"><strong>Tipo:</strong> <code>Choice (menú para elegir)</code></li>
<li data-marpit-fragment="3"><strong>Grupo:</strong> <code>New group</code> -&gt; <code>_Casa Familiar</code></li>
<li data-marpit-fragment="4"><strong>Descripción:</strong> <code>Estandarizar el progreso de las tareas.</code></li>

<li data-marpit-fragment="6"><strong>Forzar valores únicos:</strong> <code>No</code><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">1. Pending
2. In Progress
3. Blocked
4. Completed
</code></pre>
</li>
<li data-marpit-fragment="7"><strong>Permitir opciones 'Fill-in':</strong> <code>No</code> (Crítico: permitir estados personalizados rompe la automatización de tareas).</li>
<li data-marpit-fragment="8"><strong>Mostrar opciones usando:</strong> <code>Drop-Down Menu</code></li>
<li data-marpit-fragment="9"><strong>Valor por defecto:</strong> <code>1. Pending</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-marpit-fragments="9" lang="en-US">

</li>

<li data-marpit-fragment="9"><strong>Valor por defecto:</strong> <code>Choice</code> -&gt; (Dejar vacío o seleccionar el año actual).</li>

<h3 id="3-ventajas-de-este-enfoque-1">3. Ventajas de este Enfoque</h3>

<li><strong>Mantenimiento Centralizado:</strong> Si el comité decide agregar un estado llamado &quot;En Revisión&quot;, solo lo agregas en un lugar.</li>

<li><strong>Visualización Pro:</strong> Puedes aplicar [[04b-JSON-Formatting-Templates|Formatos JSON avanzados]] para que las listas sean fáciles de leer.</li>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-marpit-fragments="1" lang="en-US">
<h3 id="recursos-adicionales-1">Recursos Adicionales</h3>
<ul>
<li data-marpit-fragment="1">[[04b-JSON-Formatting-Templates|Manual de Códigos JSON para Formato de Columnas]]</li>
</ul>
<h1 id="json-formatting-templates-1">JSON Formatting Templates</h1>
<p>Estos códigos se pegan en la sección <strong>&quot;Column Formatting&quot;</strong> (al final de la pantalla de creación de la columna) o seleccionando la columna en la lista -&gt; <strong>Column settings</strong> -&gt; <strong>Format this column</strong>.</p>
<h3 id="1-cf_taskstatus_formattingjson-para-cf_taskstatus-estado-1">1. [[CF_TaskStatus_Formatting|JSON para CF_TaskStatus (Estado)]]</h3>
<p>Este JSON crea burbujas de color con texto en blanco para visibilidad inmediata.</p>

<h1 id="detalle-t%C3%A9cnico-content-types-plantillas-de-listas-1">Detalle Técnico: Content Types (Plantillas de Listas)</h1>
<h3 id="1-%C2%BFqu%C3%A9-es-un-content-type-1">1. ¿Qué es un &quot;Content Type&quot;?</h3>
<p>Si las <strong>Site Columns</strong> son los ingredientes, el <strong>Content Type</strong> es la &quot;receta&quot;. Es una plantilla que agrupa varias columnas para que puedas aplicarlas a una lista de un solo golpe.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-marpit-fragments="6" lang="en-US">
<h3 id="2-instrucciones-para-crear-el-content-type-1">2. Instrucciones para Crear el Content Type</h3>
<p>Para ambos, ve a: <strong>Settings</strong> (Engranaje) -&gt; <strong>Site information</strong> -&gt; <strong>View all site settings</strong> -&gt; <strong>Site content types</strong> -&gt; <strong>Create content type</strong>.</p>
<h4 id="a-content-type-event-task-ct-para-tareas-1">A. Content Type: <code>Event Task CT</code> (Para Tareas)</h4>
<p>Llena los campos exactamente así:</p>
<ul>
<li data-marpit-fragment="1"><strong>Name:</strong> <code>Event Task CT</code></li>
<li data-marpit-fragment="2"><strong>Description:</strong> <code>Plantilla maestra para las tareas de los eventos de Casa Familiar.</code></li>
<li data-marpit-fragment="3"><strong>Category:</strong> Selecciona <strong>&quot;New category&quot;</strong> y escribe <code>_Casa Familiar</code> (Para que aparezca junto a tus columnas).</li>
<li data-marpit-fragment="4"><strong>Parent content type:</strong>
<ul>
<li data-marpit-fragment="5"><strong>Parent category:</strong> <code>List Content Types</code></li>
<li data-marpit-fragment="6"><strong>Content type:</strong> <code>Item</code> (Es la base más limpia para construir listas personalizadas).</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-marpit-fragments="6" lang="en-US">
<h4 id="b-content-type-roster-ct-para-el-comit%C3%A9-1">B. Content Type: <code>Roster CT</code> (Para el Comité)</h4>
<p>Llena los campos exactamente así:</p>
<ul>
<li data-marpit-fragment="1"><strong>Name:</strong> <code>Roster CT</code></li>
<li data-marpit-fragment="2"><strong>Description:</strong> <code>Plantilla maestra para el listado de personas y roles del comité.</code></li>
<li data-marpit-fragment="3"><strong>Category:</strong> Selecciona <strong>&quot;Existing category&quot;</strong> -&gt; <code>_Casa Familiar</code>.</li>
<li data-marpit-fragment="4"><strong>Parent content type:</strong>
<ul>
<li data-marpit-fragment="5"><strong>Parent category:</strong> <code>List Content Types</code></li>
<li data-marpit-fragment="6"><strong>Content type:</strong> <code>Item</code>.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-marpit-fragments="4" lang="en-US">
<h3 id="3-el-paso-final-agregar-tus-columnas-1">3. El Paso Final: Agregar tus Columnas</h3>
<p>Una vez que le des a <strong>Create</strong>, SharePoint te llevará a la pantalla del nuevo Content Type. Haz lo siguiente para terminar la &quot;receta&quot;:</p>
<ol>
<li>Haz clic en <strong>Add site column</strong> (o <em>Add from existing site columns</em>).</li>
<li>Busca tu grupo <code>_Casa Familiar</code>.</li>
<li>Agrega las columnas correspondientes:
<ul>
<li data-marpit-fragment="1">Para <code>Event Task CT</code>: Agrega <code>CF_TaskStatus</code> y <code>CF_YearCycle</code>.</li>
<li data-marpit-fragment="2">Para <code>Roster CT</code>: Agrega <code>CF_CommitteeRole</code> y <code>CF_YearCycle</code>.</li>
</ul>
</li>
</ol>

<ul>

<h1 id="detalle-t%C3%A9cnico-retention-policies-microsoft-purview-1">Detalle Técnico: Retention Policies (Microsoft Purview)</h1>
<h3 id="1-%C2%BFqu%C3%A9-es-una-retention-policy-1">1. ¿Qué es una Retention Policy?</h3>
<p>Es una regla de cumplimiento que vive por encima de SharePoint, en el <strong>Microsoft Purview (Compliance Center)</strong>. Sirve para asegurar que la información importante no se pierda, ya sea por error humano o de forma intencionada.</p>
<p>En tu proyecto, los <strong>contratos y presupuestos</strong> son críticos. Una política de retención garantiza que, aunque alguien intente borrar un archivo, SharePoint guardará una copia oculta durante el tiempo que definas.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-marpit-fragments="8" lang="en-US">
<h3 id="2-configuraci%C3%B3n-en-microsoft-purview-1">2. Configuración en Microsoft Purview</h3>
<p>Para configurar esto, un administrador debe ir a: <strong>Microsoft 365 Admin Center</strong> -&gt; <strong>Compliance</strong> (o Purview) -&gt; <strong>Data Lifecycle Management</strong> -&gt; <strong>Microsoft 365</strong> -&gt; <strong>Retention Policies</strong>.</p>
<h4 id="configuraci%C3%B3n-recomendada-para-casa-familiar-1">Configuración Recomendada para Casa Familiar:</h4>
<ul>
<li data-marpit-fragment="1"><strong>Name:</strong> <code>Retention Policy - Event Contracts (5 Years)</code></li>
<li data-marpit-fragment="2"><strong>Description:</strong> <code>Retención obligatoria para documentos de contratos y finanzas de eventos.</code></li>
<li data-marpit-fragment="3"><strong>Type:</strong> <strong>Static</strong> (Para aplicar a sitios específicos).</li>
<li data-marpit-fragment="4"><strong>Locations:</strong> Selecciona <strong>SharePoint sites</strong>. Puedes elegir aplicarlo a todos los sitios o solo a los que pertenecen al Hub de eventos.</li>
<li data-marpit-fragment="5"><strong>Retention Settings:</strong>
<ul>
<li data-marpit-fragment="6"><strong>Retain items for a specific period:</strong> <code>5 years</code>.</li>
<li data-marpit-fragment="7"><strong>Start the retention period based on:</strong> <code>When items were created</code>.</li>
<li data-marpit-fragment="8"><strong>At the end of the retention period:</strong> <code>Do nothing</code> (o borrar automáticamente si quieres limpieza total).</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-marpit-fragments="3" lang="en-US">
<h3 id="3-%C2%BFc%C3%B3mo-funciona-en-la-vida-real-1">3. ¿Cómo funciona en la vida real?</h3>
<p>Si un usuario intenta borrar un contrato bajo esta política:</p>
<ol>
<li>El archivo parece desaparecer de la biblioteca de documentos.</li>
<li>Sin embargo, SharePoint lo mueve automáticamente a una biblioteca oculta llamada <strong>&quot;Preservation Hold Library&quot;</strong>.</li>
<li>Solo los administradores con permisos especiales pueden ver o recuperar esos archivos de esa biblioteca oculta durante los 5 años que dura la política.</li>
</ol>
<h3 id="4-diferencia-entre-retention-policy-y-retention-label-1">4. Diferencia entre &quot;Retention Policy&quot; y &quot;Retention Label&quot;</h3>
<ul>
<li data-marpit-fragment="1"><strong>Policy (Política):</strong> Se aplica a <strong>todo el sitio</strong> o biblioteca. Es automática y el usuario no tiene que hacer nada. <em>(Esta es la recomendada para tu Fase 1).</em></li>
<li data-marpit-fragment="2"><strong>Label (Etiqueta):</strong> El usuario elige manualmente qué archivos marcar (ej: marcar solo el archivo &quot;Contrato.pdf&quot;). Es más flexible pero requiere que la gente se acuerde de poner la etiqueta.</li>
</ul>
<h3 id="%F0%9F%93%82-relacionado-4"><img class="emoji" draggable="false" alt="📂" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c2.svg" data-marp-twemoji=""/> Relacionado</h3>
<ul>
<li data-marpit-fragment="3">[[04-Guia-Implementacion-Practica|Volver a la Guía Principal]]</li>
</ul>
<h1 id="04e---gu%C3%ADa-de-despliegue-de-site-scripts-v3-1">04e - Guía de Despliegue de Site Scripts (v3+)</h1>
<p>Esta guía explica cómo registrar y aplicar los Site Scripts (<code>event-site-template.json</code> y <code>hub-site-template.json</code>) utilizando los estándares más recientes de PnP PowerShell (Posteriores a Septiembre 2024).</p>
<h2 id="1-prerrequisitos-powershell-7-1">1. Prerrequisitos (PowerShell 7)</h2>
<p>Microsoft actualizó las políticas de seguridad en Septiembre 2024. Ahora debes registrar tu propia aplicación en tu tenant para permitir los inicios de sesión interactivos.</p>
<h3 id="11-registrar-la-app-de-pnp-en-entra-id-1">1.1 Registrar la App de PnP en Entra ID</h3>
<p>Ejecuta este comando una sola vez por tenant:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-powershell"><span class="hljs-built_in">Register-PnPEntraIDAppForInteractiveLogin</span>
</code></pre>
<ul>
<li>Se abrirá una ventana del navegador. Inicia sesión con tu cuenta de administrador.</li>
<li>Concede el consentimiento para la organización.</li>
<li>IMPORTANTE: En tu terminal de PowerShell, aparecerá un Application (Client) ID. Cópialo y guárdalo.</li>
</ul>
<h2 id="2-conectar-a-sharepoint-1">2. Conectar a SharePoint</h2>
<p>Una vez registrado, conéctate usando tu nuevo Client ID:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-powershell"><span class="hljs-variable">$SiteURL</span> = <span class="hljs-string">&quot;https://netorg4878279.sharepoint.com/sites/TuSitio&quot;</span>
<span class="hljs-variable">$ClientID</span> = <span class="hljs-string">&quot;TU-CLIENT-ID-AQUI&quot;</span>

<span class="hljs-built_in">Connect-PnPOnline</span> <span class="hljs-literal">-Url</span> <span class="hljs-variable">$SiteURL</span> <span class="hljs-literal">-Interactive</span> <span class="hljs-literal">-ClientId</span> <span class="hljs-variable">$ClientID</span>
</code></pre>
<h2 id="3-registrar-el-site-script-1">3. Registrar el Site Script</h2>
<p>Para agregar tu JSON como una plantilla en SharePoint:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-powershell"><span class="hljs-comment"># Leer el archivo JSON</span>
<span class="hljs-variable">$json</span> = <span class="hljs-built_in">Get-Content</span> <span class="hljs-literal">-Path</span> <span class="hljs-string">&quot;.\event-site-template.json&quot;</span> <span class="hljs-literal">-Raw</span>

<span class="hljs-comment"># Agregar el Site Script a SharePoint</span>
<span class="hljs-built_in">Add-PnPSiteScript</span> <span class="hljs-literal">-Title</span> <span class="hljs-string">&quot;Casa Familiar - Event Site Template&quot;</span> <span class="hljs-literal">-Content</span> <span class="hljs-variable">$json</span> <span class="hljs-literal">-Description</span> <span class="hljs-string">&quot;Listas estandarizadas para planeación de eventos&quot;</span>
</code></pre>
<p>Toma nota del ID devuelto por este comando.</p>
<h2 id="4-crear-el-site-design-plantilla-de-sitio-1">4. Crear el Site Design (Plantilla de Sitio)</h2>
<p>Ahora, vincula ese script a un &quot;Site Design&quot; para que aparezca en la interfaz web:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-powershell"><span class="hljs-built_in">Add-PnPSiteDesign</span> <span class="hljs-literal">-Title</span> <span class="hljs-string">&quot;Event Planning Site&quot;</span> <span class="hljs-literal">-SiteScriptIds</span> <span class="hljs-string">&quot;EL-ID-DEL-PASO-3&quot;</span> <span class="hljs-literal">-WebTemplate</span> <span class="hljs-string">&quot;64&quot;</span>
</code></pre>
<p>Nota: &quot;64&quot; es el ID para un Team Site.</p>
<h2 id="5-aplicaci%C3%B3n-visual-interfaz-web-1">5. Aplicación Visual (Interfaz Web)</h2>
<p>Una vez registrado vía PowerShell, puedes aplicarlo visualmente:</p>
<ol>
<li>Ve a tu nuevo sitio de SharePoint.</li>
<li>Haz clic en Settings (Icono del engrane) -&gt; Apply a site template.</li>
<li>Ve a la pestaña From your organization.</li>
<li>Selecciona &quot;Event Planning Site&quot; y haz clic en Use template.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-marpit-fragments="2" lang="en-US">
<blockquote>
<p>[!TIP]<br />
Usa <code>Get-PnPSiteScript</code> y <code>Get-PnPSiteDesign</code> para listar las plantillas ya registradas.</p>
</blockquote>
<h1 id="detalle-t%C3%A9cnico-visualizaci%C3%B3n-en-p%C3%A1ginas-web-parts-1">Detalle Técnico: Visualización en Páginas (Web Parts)</h1>
<h3 id="1-la-diferencia-entre-lista-y-p%C3%A1gina-1">1. La Diferencia entre Lista y Página</h3>
<ul>
<li data-marpit-fragment="1"><strong>La Lista:</strong> Es el &quot;depósito&quot; de datos. Es donde entras a escribir las tareas, elegir el año y ver los colores. (Ej: <code>https://tu-sitio/Lists/EventTasks</code>).</li>
<li data-marpit-fragment="2"><strong>La Página:</strong> Es la &quot;cara&quot; del sitio. Es lo que los usuarios ven al entrar (Home). Aquí es donde <strong>muestras</strong> la lista de forma elegante.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" lang="en-US">
<h3 id="2-c%C3%B3mo-agregar-tus-columnas-maestras-a-una-lista-1">2. Cómo agregar tus Columnas Maestras a una Lista</h3>
<p>Si ya tienes una lista creada y quieres empezar a usar tus columnas (Status, Year, Role), sigue esta ruta para no tener que crearlas de nuevo:</p>
<ol>
<li>Entra a la lista en SharePoint.</li>
<li>Haz clic en el engrane (Settings) -&gt; List settings.</li>
<li>Baja a la sección Columns y haz clic en Add from existing site columns.</li>
<li>En &quot;Select columns from&quot;, elige tu grupo _Casa Familiar.</li>
<li>Selecciona la columna, dale a Add &gt; y luego a OK.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" lang="en-US">
<h3 id="3-c%C3%B3mo-mostrar-tu-lista-en-la-p%C3%A1gina-principal-home-1">3. Cómo mostrar tu lista en la Página Principal (Home)</h3>
<p>Para que el comité vea sus tareas al entrar al sitio:</p>
<ol>
<li>Ve a la página de inicio (Home) y haz clic en Edit (esquina superior derecha).</li>
<li>Haz clic en el círculo con el símbolo de más (+) para agregar un nuevo web part.</li>
<li>Busca y selecciona el web part de List.</li>
<li>Selecciona la lista de tareas (ej: Event Tasks).</li>
<li>Haz clic en Republish para guardar los cambios.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-marpit-fragments="6" lang="en-US">
<h3 id="4-personalizar-la-vista-en-la-p%C3%A1gina-1">4. Personalizar la vista en la Página</h3>
<p>Una vez que la lista está en la página, puedes:</p>
<ul>
<li data-marpit-fragment="1"><strong>Filtrar:</strong> Configurar el componente para que solo muestre las tareas &quot;Blocked&quot;.</li>
<li data-marpit-fragment="2"><strong>Esconder columnas:</strong> Para que la página no se vea muy cargada, puedes esconder la columna &quot;ID&quot; o &quot;Creado por&quot; y dejar solo lo importante.</li>
</ul>
<h3 id="5-resumen-visual-1">5. Resumen Visual</h3>
<ul>
<li data-marpit-fragment="3"><strong>¿Dónde vive la columna?</strong> En la Lista.</li>
<li data-marpit-fragment="4"><strong>¿Dónde se ve el Dashboard?</strong> En la Página (usando el Web Part de Lista).</li>
</ul>

<h3 id="3-c%C3%B3mo-desplegar-estrategia-de-script-dual-1">3. Cómo Desplegar (Estrategia de Script Dual)</h3>
<p>Dado que ahora tienes una arquitectura con un Hub central y múltiples Sitios de Eventos conectados, tienes <strong>dos scripts JSON diferentes</strong>.</p>
<h4 id="a-desplegando-el-hub-site-script-hub-site-templatejson-1">A. Desplegando el Hub Site Script (<code>hub-site-template.json</code>)</h4>
<p>Este script solo debe ejecutarse <strong>una vez</strong> en tu portal principal. Fuerza el tema Teal y establece el layout a MegaMenu con cabecera compacta.</p>
<p><strong>Importante:</strong> Antes de ejecutar estos comandos, asegúrate de haber seguido la <strong>[[04e-Detalle-Site-Scripts|Nueva Guía de Autenticación]]</strong> para registrar tu Client ID.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-powershell"><span class="hljs-comment"># Conectar usando PnP (Moderno)</span>
<span class="hljs-built_in">Connect-PnPOnline</span> <span class="hljs-literal">-Url</span> https://netorg4878279.sharepoint.com/sites/TuHub <span class="hljs-literal">-Interactive</span> <span class="hljs-literal">-ClientId</span> <span class="hljs-string">&quot;TU-ID&quot;</span>

<span class="hljs-variable">$hubContent</span> = <span class="hljs-built_in">Get-Content</span> <span class="hljs-string">&quot;.\hub-site-template.json&quot;</span> <span class="hljs-literal">-Raw</span>
<span class="hljs-variable">$hubResult</span> = <span class="hljs-built_in">Add-PnPSiteScript</span> <span class="hljs-literal">-Title</span> <span class="hljs-string">&quot;Casa Familiar - Hub Branding&quot;</span> <span class="hljs-literal">-Content</span> <span class="hljs-variable">$hubContent</span>
<span class="hljs-built_in">Add-PnPSiteDesign</span> <span class="hljs-literal">-Title</span> <span class="hljs-string">&quot;Apply Hub Branding&quot;</span> <span class="hljs-literal">-SiteScriptIds</span> <span class="hljs-variable">$hubResult</span>.Id <span class="hljs-literal">-WebTemplate</span> <span class="hljs-string">&quot;68&quot;</span>
</code></pre>
<p><em>Aplica esta plantilla &quot;Apply Hub Branding&quot; solo a tu Hub Site principal.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" lang="en-US">
<h4 id="b-desplegando-el-event-sites-script-event-site-templatejson-1">B. Desplegando el Event Sites Script (<code>event-site-template.json</code>)</h4>
<p>Este es el motor principal. Crea las 4 listas, se une al Hub automáticamente y configura el Menú Izquierdo. Lo aplicarás a <em>cada</em> nuevo sitio de evento que crees (ej: The Walk 2025).</p>
<p><strong>Si estás actualizando el script existente (V5):</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-powershell"><span class="hljs-variable">$newContent</span> = <span class="hljs-built_in">Get-Content</span> <span class="hljs-string">&quot;.\event-site-template.json&quot;</span> <span class="hljs-literal">-Raw</span>
<span class="hljs-built_in">Set-PnPSiteScript</span> <span class="hljs-literal">-Identity</span> <span class="hljs-string">&quot;3b6c1a53-25d0-4cb0-bb48-ad0d0f6522e4&quot;</span> <span class="hljs-literal">-Content</span> <span class="hljs-variable">$newContent</span>
</code></pre>
<p><strong>Si estás creando una plantilla nueva para Sitios de Eventos:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-powershell"><span class="hljs-variable">$content</span> = <span class="hljs-built_in">Get-Content</span> <span class="hljs-string">&quot;.\event-site-template.json&quot;</span> <span class="hljs-literal">-Raw</span>
<span class="hljs-variable">$result</span> = <span class="hljs-built_in">Add-PnPSiteScript</span> <span class="hljs-literal">-Title</span> <span class="hljs-string">&quot;Casa Familiar V5 - Event Site&quot;</span> <span class="hljs-literal">-Content</span> <span class="hljs-variable">$content</span>
<span class="hljs-built_in">Add-PnPSiteDesign</span> <span class="hljs-literal">-Title</span> <span class="hljs-string">&quot;Casa Familiar - Full Event Setup&quot;</span> <span class="hljs-literal">-SiteScriptIds</span> <span class="hljs-variable">$result</span>.Id <span class="hljs-literal">-WebTemplate</span> <span class="hljs-string">&quot;64&quot;</span>
</code></pre>
<p><em>Nota: Usamos WebTemplate &quot;64&quot; para Team Sites modernos.</em></p>
<h4 id="despu%C3%A9s-de-subir-ambas-opciones-1">Después de Subir (Ambas Opciones):</h4>
<ol>
<li>Ve a tu sitio de SharePoint.</li>
<li>Haz clic en el engrane -&gt; <strong>Apply a site template</strong> -&gt; <strong>From your organization</strong>.</li>
<li>Selecciona <strong>&quot;Casa Familiar - Full Event Setup&quot;</strong>.</li>
<li>¡Listo! Se aplicarán las 4 listas, vistas, enlaces de navegación y el branding.</li>
</ol>
<blockquote>
<p><strong>Importante:</strong> Si las listas ya existen de una ejecución previa, el script omitirá su creación pero no agregará nuevas columnas. Para probar un despliegue limpio, aplícalo en un sitio nuevo o borra las listas existentes primero.</p>
</blockquote>
</section>

<h1 id="04j---gu%C3%ADa-de-despliegue-oficial-de-sharepoint-online-spo-1">04j - Guía de Despliegue Oficial de SharePoint Online (SPO)</h1>
<p>Si prefieres usar el <strong>Microsoft SharePoint Online Management Shell Oficial</strong> en lugar de PnP, utiliza esta guía. Este método es la forma &quot;tradicional&quot; y NO requiere registrar una aplicación en Entra ID.</p>
<h2 id="1-prerrequisitos-1">1. Prerrequisitos</h2>
<p>Asegúrate de tener instalado el módulo oficial:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-powershell"><span class="hljs-built_in">Install-Module</span> <span class="hljs-literal">-Name</span> Microsoft.Online.SharePoint.PowerShell <span class="hljs-literal">-Force</span>
</code></pre>
<h2 id="2-conectar-a-tu-centro-de-administraci%C3%B3n-1">2. Conectar a tu Centro de Administración</h2>
<p>Reemplaza <code>netorg4878279</code> con el nombre real de tu tenant:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-powershell"><span class="hljs-built_in">Connect-SPOService</span> <span class="hljs-literal">-Url</span> https://netorg4878279<span class="hljs-literal">-admin</span>.sharepoint.com
</code></pre>
<h2 id="3-registrar-el-site-script-json-1">3. Registrar el Site Script (JSON)</h2>
<p>Ejecuta estos comandos para subir tu <code>event-site-template.json</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-powershell"><span class="hljs-comment"># 1. Leer el contenido del JSON</span>
<span class="hljs-variable">$json</span> = <span class="hljs-built_in">Get-Content</span> <span class="hljs-literal">-Path</span> <span class="hljs-string">&quot;.\event-site-template.json&quot;</span> <span class="hljs-literal">-Raw</span>

<span class="hljs-comment"># 2. Agregar el script a tu tenant</span>
<span class="hljs-variable">$script</span> = <span class="hljs-built_in">Add-SPOSiteScript</span> <span class="hljs-literal">-Title</span> <span class="hljs-string">&quot;Casa Familiar - Official Event Site&quot;</span> <span class="hljs-literal">-Content</span> <span class="hljs-variable">$json</span>

<span class="hljs-comment"># 3. Crear el Site Design (Plantilla)</span>
<span class="hljs-comment"># Usa WebTemplate &quot;64&quot; para Team Sites</span>
<span class="hljs-built_in">Add-SPOSiteDesign</span> <span class="hljs-literal">-Title</span> <span class="hljs-string">&quot;Official Event Setup&quot;</span> <span class="hljs-literal">-WebTemplate</span> <span class="hljs-string">&quot;64&quot;</span> <span class="hljs-literal">-SiteScripts</span> <span class="hljs-variable">$script</span>.Id
</code></pre>
<h2 id="4-%C2%BFpor-qu%C3%A9-usar-pnp-para-carpetas-1">4. ¿Por qué usar PnP para Carpetas?</h2>
<p>Aunque el módulo oficial de SPO (arriba) es perfecto para registrar scripts, <strong>no puede</strong> crear fácilmente carpetas dentro de las bibliotecas de documentos ni gestionar MegaMenus.</p>
<ul>
<li><strong>Para el JSON:</strong> Usa el módulo Oficial de SPO (esta guía).</li>
<li><strong>Para Carpetas/Menús:</strong> Usa PnP PowerShell (ya que sus cmdlets están diseñados específicamente para la automatización de contenido).</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" lang="en-US">
<blockquote>
<p>[!TIP]<br />
Usa <code>Get-SPOSiteScript</code> y <code>Get-SPOSiteDesign</code> para gestionar tus plantillas oficiales a través del módulo de SPO.</p>
</blockquote>
<h1 id="mejoras-adicionales-de-sharepoint-nativas-1">Mejoras Adicionales de SharePoint (Nativas)</h1>
<p>A continuación se presentan recomendaciones de mejora adicionales para los sitios de eventos de Casa Familiar, utilizando exclusivamente herramientas nativas de Microsoft 365 y SharePoint incluidas en el licenciamiento estándar para evitar generar costos extra.</p>
<h2 id="1-integraci%C3%B3n-nativa-con-microsoft-teams-1">1. Integración Nativa con Microsoft Teams</h2>
<p>Dado que cada sitio de evento está asociado a un Grupo de M365 (y por lo tanto a un Team de Teams), podemos unificar aún más la experiencia del comité.</p>
<ul>
<li><strong>Pestaña de Tareas:</strong> Incrusta directamente la vista de la lista <em>Event Tasks</em> (como pestaña de Sitio Web o Lista) dentro del canal General en Teams. Esto permite que el comité actualice su progreso sin necesidad de abrir el navegador web.</li>
<li><strong>Canales por Área:</strong> En lugar de enviar correos caóticos, crea canales en Teams para <code>#Logística</code>, <code>#Voluntariado</code>, <code>#Marketing</code> para centrar las conversaciones. Las carpetas en la Biblioteca de Documentos del sitio deben alinearse con la estructura de canales en Teams.</li>
</ul>
<h2 id="2-vistas-visuales-board-view-kanban-1">2. Vistas Visuales: Board View (Kanban)</h2>
<p>En la lista de <em>Event Tasks</em>, configura una &quot;Board View&quot; (Vista de Tablero) basada en la columna <code>CF_TaskStatus</code>.</p>
<ul>
<li><strong>Beneficio:</strong> Esta es una funcionalidad <em>Out-of-the-Box</em>. Permite al comité visualizar su carga de trabajo en columnas (Pending -&gt; In Progress -&gt; Completed) y arrastrar y soltar tarjetas.</li>
<li><strong>Reemplazo de Power Apps:</strong> Esta vista mejora la experiencia web y móvil de forma gratuita sin diseñar formularios complejos.</li>
</ul>
<h2 id="3-seguimiento-de-presupuesto-expense-tracking-1">3. Seguimiento de Presupuesto (Expense Tracking)</h2>
<p>Para el control financiero de eventos sin fines de lucro.</p>
<ul>
<li><strong>Lista Adicional (<code>Event Budget</code>):</strong> Crea una lista con las siguientes columnas:
<ul>
<li><code>Item Concept</code> (Texto)</li>
<li><code>Estimated Amount</code> (Moneda)</li>
<li><code>Actual Amount</code> (Moneda)</li>
<li><code>Category</code> (Choice: Food, Rental, Marketing, etc.)</li>
<li><code>CF_YearCycle</code> (Número)</li>
<li>Attachments habilitados (para subir cotizaciones y recibos).</li>
</ul>
</li>
<li><strong>Enlace de Facturas:</strong> El Lead del comité puede autorizarlas, y se agrupan por <code>Category</code> para tener sub-totales automáticos nativos en la vista de lista.</li>
</ul>
<h2 id="4-directorio-y-recursos-compartidos-en-el-hub-1">4. Directorio y Recursos Compartidos en el Hub</h2>
<p>Para evitar duplicar el esfuerzo de buscar proveedores año tras año entre diferentes comités:</p>
<ul>
<li><strong>Lista Maestra de Proveedores en el Hub:</strong> <code>Casa Familiar Vendors</code>.
<ul>
<li>Columnas: Nombre, Contacto, Teléfono, Especialidad (Comida, Música, Seguridad), Calificación (1 a 5 estrellas por el Lead anterior).</li>
</ul>
</li>
<li><strong>Lookup Column:</strong> En cada lista de <code>Event Tasks</code> e incluso en la lista de presupuesto (<code>Event Budget</code>), utiliza una columna de búsqueda (Lookup) referenciando la lista del Hub Site. Esta es una funcionalidad nativa y evita la redundancia de datos.</li>
</ul>
<h2 id="5-cuadros-de-mando-ejetutivos-dashboards-y-reportes-1">5. Cuadros de Mando Ejetutivos (Dashboards) y Reportes</h2>
<p>Para la junta directiva de Casa Familiar que requiere una visión general sin entrar en el detalle de todos los sitios:</p>
<ul>
<li><strong>Página Principal del Hub (Vista de Roll-up):</strong> Usa el Web Part de &quot;Highlighted Content&quot; o &quot;News&quot; en el <code>Casa Familiar Events Hub</code> para consultar una vista consolidada de todas las <em>Event Tasks</em> a través de los 5 sitios asociados que tengan estado <code>Blocked</code> y el <code>CF_YearCycle</code> actual. Esto resalta rápidamente si algún evento necesita apoyo de la alta gerencia, utilizando el motor de búsqueda interno de SharePoint de forma gratuita.</li>
</ul>
<h1 id="plan-de-gobernanza-de-datos-sitios-de-eventos-casa-familiar-1">Plan de Gobernanza de Datos: Sitios de Eventos &quot;Casa Familiar&quot;</h1>
<p>Este documento establece las reglas y políticas para asegurar que la información generada en cada sitio de evento se mantenga segura, organizada y cumpla con las políticas de retención de la organización.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-marpit-fragments="8" lang="en-US">
<h2 id="1-estructura-y-arquitectura-d%C3%B3nde-vive-la-informaci%C3%B3n-1">1. Estructura y Arquitectura (Dónde vive la información)</h2>
<p>El modelo de gobernanza se basa en una arquitectura <strong>&quot;Hub &amp; Spoke&quot;</strong> (Centro y Ejes):</p>
<ul>
<li data-marpit-fragment="1">
<p><strong>El Centro (Hub Site):</strong> <code>Casa Familiar Events</code></p>
<ul>
<li data-marpit-fragment="2"><strong>Propósito:</strong> Portal público para todos los empleados. Consolidación de información de todos los eventos.</li>
<li data-marpit-fragment="3"><strong>Gobernanza:</strong> Solo el equipo core de planeación (y TI) tiene permisos de edición. El resto de la organización solo tiene acceso de <em>Lectura</em>.</li>
<li data-marpit-fragment="4"><strong>Datos alojados:</strong> Políticas generales, plantillas maestras, columnas de sitio globales (<code>CF_TaskStatus</code>, etc.).</li>
</ul>
</li>
<li data-marpit-fragment="5">
<p><strong>Los Ejes (Event Sites):</strong> <code>Event: [Nombre del Evento 202X]</code></p>
<ul>
<li data-marpit-fragment="6"><strong>Propósito:</strong> Espacio de trabajo colaborativo específico para <em>cada</em> evento.</li>
<li data-marpit-fragment="7"><strong>Gobernanza:</strong> Todos los miembros del comité del evento tienen permisos de edición.</li>
<li data-marpit-fragment="8"><strong>Datos alojados:</strong> Presupuestos específicos, listas de tareas del evento, contratos de proveedores, rosters.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-marpit-fragments="1" lang="en-US">
<h2 id="2-gesti%C3%B3n-de-permisos-qui%C3%A9n-puede-ver-y-editar-1">2. Gestión de Permisos (Quién puede ver y editar)</h2>
<p>La seguridad se maneja mediante Grupos de Microsoft 365 y niveles de permiso estándar de SharePoint. No se deben romper las herencias de permisos a nivel de carpeta o archivo individual a menos que sea estrictamente necesario (ej: Presupuestos).</p>
<table>
<thead>
<tr>
<th style="text-align:left">Rol en el Evento</th>
<th style="text-align:left">Grupo de SharePoint</th>
<th style="text-align:left">Nivel de Permiso</th>
<th style="text-align:left">Cuándo usarlo</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Director / Líder de Proyecto</strong></td>
<td style="text-align:left">Owners (Propietarios)</td>
<td style="text-align:left">Full Control</td>
<td style="text-align:left">Puede crear listas, cambiar configuraciones del sitio y gestionar accesos. Máximo 2-3 personas.</td>
</tr>
<tr>
<td style="text-align:left"><strong>Comité / Coordinadores / Volunteers Core</strong></td>
<td style="text-align:left">Members (Miembros)</td>
<td style="text-align:left">Edit</td>
<td style="text-align:left">Pueden agregar, editar y borrar tareas, riesgos, documentos y elementos del presupuesto.</td>
</tr>
<tr>
<td style="text-align:left"><strong>Voluntarios Generales / Staff Externo</strong></td>
<td style="text-align:left">Visitors (Visitantes)</td>
<td style="text-align:left">Read</td>
<td style="text-align:left">Solo pueden ver la información para estar enterados, pero no pueden modificar documentos ni listas.</td>
</tr>
</tbody>
</table>
<p><strong>Excepción Crítica (Lista de Presupuesto):</strong><br />
La lista <code>Event Budget</code> y la carpeta de facturas/contratos deben configurarse para que solo el rol de <em>Owners</em> y el área de Finanzas puedan aprobar (&quot;Payment Status: Paid&quot;).</p>
<ul>
<li data-marpit-fragment="1"><strong>Acción:</strong> Romper la herencia de permisos solo en esa lista si se requiere privacidad financiera absoluta.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-marpit-fragments="2" lang="en-US">
<h2 id="3-retenci%C3%B3n-y-ciclo-de-vida-de-los-datos-cu%C3%A1nto-tiempo-se-guarda-1">3. Retención y Ciclo de Vida de los Datos (Cuánto tiempo se guarda)</h2>
<p>Para cumplir con normativas legales y evitar la acumulación de &quot;basura digital&quot;, se aplicarán políticas de retención y limpieza automatizada.</p>
<h3 id="31-pol%C3%ADtica-de-retenci%C3%B3n-legal-microsoft-purview-1">3.1 Política de Retención Legal (Microsoft Purview)</h3>
<ul>
<li data-marpit-fragment="1"><strong>Alcance:</strong> Documentos críticos (Contratos de proveedores, Facturas firmadas, Pólizas de seguro, Evidencia de mitigación de riesgos).</li>
<li data-marpit-fragment="2"><strong>Regla:</strong> Retención de <strong>10 años</strong> desde que se marca como &quot;Final&quot; o &quot;Pagado&quot;. No pueden ser eliminados permanentemente ni por el usuario (ver [[04d-Detalle-Retention-Policies]]).</li>
</ul>
<h3 id="32-ciclo-de-vida-del-sitio-del-evento-site-lifecycle-management-1">3.2 Ciclo de Vida del Sitio del Evento (Site Lifecycle Management)</h3>
<p>Dado que se crean nuevos sitios cada año (ej: The Walk 2024, The Walk 2025), los sitios viejos deben &quot;congelarse&quot;.</p>
<table>
<thead>
<tr>
<th style="text-align:left">Fase</th>
<th style="text-align:left">Cuándo Ocurre</th>
<th style="text-align:left">Acción de Gobernanza</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>1. Activo</strong></td>
<td style="text-align:left">Planeación y ejecución del evento</td>
<td style="text-align:left">Accesos normales (Edición completa para miembros).</td>
</tr>
<tr>
<td style="text-align:left"><strong>2. Cierre (Read-Only)</strong></td>
<td style="text-align:left">30 días después del evento</td>
<td style="text-align:left">TI o el Dueño del Sitio cambian el grupo de &quot;Members&quot; a &quot;Visitors&quot;. El sitio se vuelve un &quot;archivo histórico de solo lectura&quot;. Nadie puede modificar datos pasados.</td>
</tr>
<tr>
<td style="text-align:left"><strong>3. Archivado Profundo</strong></td>
<td style="text-align:left">3 años después del evento</td>
<td style="text-align:left">Se desvincula del Menú del Hub (ya no es visible globalmente) pero sigue accesible vía búsqueda e indexación para auditorías.</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" lang="en-US">
<h2 id="4-estandarizaci%C3%B3n-de-metadatos-c%C3%B3mo-se-etiqueta-la-informaci%C3%B3n-1">4. Estandarización de Metadatos (Cómo se etiqueta la información)</h2>
<p>Para poder buscar reportes (ej: &quot;Muéstrame todas las tareas 'Completadas' de todos los eventos del '2024'&quot;), dependemos 100% del uso estricto de <strong>Site Columns</strong> aplicadas vía los <strong>Site Scripts</strong> (ver [[04h-Site-Script]]).</p>
<p><strong>Reglas de Ingreso de Datos:</strong></p>
<ol>
<li><strong>Cero Listas Personalizadas a nivel Raíz:</strong> Todas las listas core (Tasks, Risks, Budget, Roster) <em>deben</em> crearse siempre y únicamente usando el template oficial &quot;Casa Familiar - Full Event Setup&quot;.</li>
<li><strong>No modificar tipos de campo Core:</strong> Los campos inyectados por el template (<code>CF_TaskStatus</code>, <code>Expense Category</code>) no deben ser borrados ni renombrados por los dueños del sitio.</li>
<li><strong>Uso de Metadatos Obligatorios:</strong> Los campos definidos como <code>isRequired: true</code> en el template (Ej: <em>Due Date</em>, <em>Estimated Cost</em>) garantizan que no existan registros &quot;huérfanos&quot;.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-marpit-fragments="5" lang="en-US">
<h2 id="5-auditor%C3%ADa-y-revisiones-1">5. Auditoría y Revisiones</h2>
<ul>
<li data-marpit-fragment="1"><strong>Frecuencia:</strong> Bimestral.</li>
<li data-marpit-fragment="2"><strong>Responsable:</strong> Administrador de SharePoint / Project Manager Global.</li>
<li data-marpit-fragment="3"><strong>Acción:</strong>
<ol>
<li>Revisar el <em>Site Usage Analytics</em> para identificar sitios &quot;abandonados&quot;.</li>
<li>Verificar que los <em>Owners</em> de los sitios siguen siendo empleados activos de Casa Familiar (Identity Management).</li>
<li>Asegurar que ningún sitio de evento tenga habilitada la opción de compartir enlaces anónimos (&quot;Anyone with the link&quot;) para proteger información personal del Roster o Financiera.</li>
</ol>
</li>
</ul>
<h3 id="%F0%9F%93%82-relacionado-5"><img class="emoji" draggable="false" alt="📂" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c2.svg" data-marp-twemoji=""/> Relacionado</h3>
<ul>
<li data-marpit-fragment="4">[[04d-Detalle-Retention-Policies|Política técnica de Prevención de Datos (Purview)]]</li>
<li data-marpit-fragment="5">[[04h-Site-Script|Documentación del Template Automatizado Principal]]</li>
</ul>
<h1 id="estrategia-de-reutilizaci%C3%B3n-anual-de-sitios-1">Estrategia de Reutilización Anual de Sitios</h1>
<p>Cuando un evento se repite cada año (Ej: <em>The Walk 2024</em>, <em>The Walk 2025</em>), surge la pregunta: <strong>¿Reutilizo el mismo sitio de SharePoint y borro lo viejo, o creo uno nuevo?</strong></p>
<p>En SharePoint Moderno, la recomendación de Microsoft es casi siempre <strong>crear un sitio nuevo</strong>. Aquí explicamos por qué y cómo manejar ambas estrategias.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="86" data-marpit-fragments="2" lang="en-US">
<h2 id="estrategia-1-nuevo-a%C3%B1o-nuevo-sitio-recomendada-1">Estrategia 1: &quot;Nuevo Año, Nuevo Sitio&quot; (Recomendada)</h2>
<p>En lugar de borrar tareas viejas, creas un sitio fresco usando el <strong>Site Script</strong> que ya automatizamos.</p>
<ul>
<li data-marpit-fragment="1"><strong>Ejemplo:</strong> Tienes <code>casafamiliar.sharepoint.com/sites/TheWalk2024</code>. El próximo año creas <code>.../sites/TheWalk2025</code>.</li>
</ul>
<h3 id="ventajas-2">Ventajas</h3>
<ol>
<li><strong>Auditoría perfecta:</strong> Tienes un archivo histórico intacto de lo que pasó en 2024 (quién hizo qué, cuánto costó, qué falló).</li>
<li><strong>Cero riesgo de borrado:</strong> No hay peligro de que alguien borre por accidente un contrato de 2024 creyendo que era &quot;basura&quot; para limpiar la lista.</li>
<li><strong>Cumplimiento Legal (Purview):</strong> Las políticas de retención de 10 años funcionan perfectamente porque el sitio viejo simplemente se archiva (ver [[05-Plan-Gobernanza-Datos]]).</li>
<li><strong>Rapidez:</strong> Gracias a tu Site Script ([[04h-Site-Script]]), crear el sitio 2025 y sus listas toma menos de 2 minutos.</li>
</ol>
<h3 id="desventajas-1">Desventajas</h3>
<ul>
<li data-marpit-fragment="2">Genera más sitios en tu consola de administración (lo cual es normal y esperado en Microsoft 365).</li>
</ul>
<h3 id="flujo-de-trabajo-paso-a-paso-1">Flujo de Trabajo (Paso a Paso):</h3>
<ol>
<li><strong>Cierre del Evento (Noviembre 2024):</strong> Cambias los permisos del sitio <code>TheWalk2024</code> a &quot;Solo Lectura&quot;. Nada se toca.</li>
<li><strong>Inicio Nuevo Ciclo (Enero 2025):</strong> Creas el sitio <code>TheWalk2025</code>.</li>
<li><strong>Aplicar Template:</strong> Ejecutas el template &quot;Casa Familiar - Full Event Setup&quot; en el nuevo sitio.</li>
<li><strong>Enlazar al Hub:</strong> El script ya lo conecta automáticamente al hub principal.</li>
<li><strong>Copiar Plantillas:</strong> Mueves manualmente solo los documentos de plantilla &quot;en blanco&quot; (ej: formato de check-in) del sitio 2024 al 2025.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="87" data-marpit-fragments="2" lang="en-US">
<h2 id="estrategia-2-reciclaje-de-sitio-no-recomendada-pero-posible-1">Estrategia 2: &quot;Reciclaje de Sitio&quot; (No recomendada, pero posible )</h2>
<p>Usas exactamente el mismo sitio (<code>casafamiliar.sharepoint.com/sites/TheWalk</code>) año tras año, limpiando las listas.</p>
<h3 id="ventajas-3">Ventajas</h3>
<ul>
<li data-marpit-fragment="1">La URL nunca cambia. Los voluntarios siempre guardan el mismo link en sus favoritos.</li>
<li data-marpit-fragment="2">No tienes que mover ni copiar documentos base de un año a otro.</li>
</ul>
<h3 id="desventajas-riesgos-altos-1">Desventajas (Riesgos Altos)</h3>
<ol>
<li><strong>Pérdida de Historial:</strong> Para usar listas como <em>Event Tasks</em> limpias, alguien tiene que borrar las tareas del año pasado. Se pierde el historial operativo.</li>
<li><strong>Choque Legal:</strong> Si configuras la política de Retención de 10 años, <strong>Microsoft M365 te impedirá borrar elementos</strong> de la lista para reciclarlos. El sistema te marcará error al intentar &quot;limpiar&quot; para el nuevo año.</li>
<li><strong>Saturación de Vistas:</strong> Si decides <em>no</em> borrar, sino solo cambiar la columna <code>CF_YearCycle</code> (ej: filtrar la vista para que solo muestre &quot;2025&quot;), después de 3 años tu lista de Tareas será inmensa, muy lenta de cargar, y la búsqueda será un caos.</li>
</ol>
<h3 id="flujo-de-trabajo-si-decides-hacerlo-as%C3%AD-1">Flujo de Trabajo (Si decides hacerlo así):</h3>
<ol>
<li><strong>Cierre del Evento:</strong> Debes exportar tus listas (Tasks, Risks, Budget) a Excel como respaldo histórico.</li>
<li><strong>Limpieza manual:</strong> Un administrador debe entrar y borrar <strong>todos</strong> los elementos de todas las listas. <em>(Reitero: esto fallará si tienes Retention Policies activas)</em>.</li>
<li><strong>Actualizar Documentos:</strong> Mover los documentos del año pasado a una carpeta llamada &quot;Archive 2024&quot;.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="88" data-marpit-fragments="2" lang="en-US">
<h2 id="veredicto-para-casa-familiar-1">Veredicto para Casa Familiar</h2>
<p>Dado que has implementado <strong>Site Scripts Autómatizados</strong> y necesitas <strong>Políticas de Retención de Contratos</strong>, la única estrategia viable y segura a largo plazo es la <strong>Estrategia 1 (Nuevo Año, Nuevo Sitio)</strong>.</p>
<p><strong>Solución al problema del &quot;link eterno&quot;:</strong><br />
Para evitar que los usuarios se confundan con URLs nuevas cada año, la mejor práctica es:<br />
En tu <strong>Hub Site principal</strong>, pon un botón gigante que diga &quot;Ir al Evento The Walk Actual&quot;. Tú como administrador, solo actualizas ese botón cada año para que apunte al nuevo sitio (del 2024 al 2025). El usuario final solo tiene que recordar la ruta del Hub Site.</p>
<h3 id="%F0%9F%93%82-relacionado-6"><img class="emoji" draggable="false" alt="📂" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c2.svg" data-marp-twemoji=""/> Relacionado</h3>
<ul>
<li data-marpit-fragment="1">[[04h-Site-Script|Recuerda cómo aplicar el template para sitios nuevos]]</li>
<li data-marpit-fragment="2">[[05-Plan-Gobernanza-Datos|Reglas sobre qué hacer con los sitios viejos]]</li>
</ul>
<h1 id="estrategia-de-archivos-centralizados-hub-vs-event-sites-1">Estrategia de Archivos Centralizados (Hub vs Event Sites)</h1>
<p>El modelo de &quot;Hub &amp; Spoke&quot; (Centro y Ejes) no solo aplica a las listas, sino también a la gestión de documentos. El error más común al planear eventos es tener 5 versiones diferentes del mismo &quot;Formato de Check-in&quot; regadas por todos los sitios.</p>
<p>Aquí tienes el plan recomendado para gobernar los archivos y mantener una &quot;Única Fuente de Verdad&quot; (Single Source of Truth).</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-marpit-fragments="4" lang="en-US">
<h2 id="1-el-hub-site-la-biblioteca-maestra-plantillas-y-pol%C3%ADticas-1">1. El Hub Site: La Biblioteca Maestra (Plantillas y Políticas)</h2>
<p>El sitio Hub (<code>Event Planning Improvements Project</code>) es el &quot;Corporativo&quot;. Aquí no se guarda trabajo en progreso de ningún evento específico.</p>
<h3 id="bibliotecas-de-documentos-recomendadas-en-el-hub-1">Bibliotecas de Documentos Recomendadas en el Hub:</h3>
<ol>
<li><strong>&quot;Master Templates&quot; (Plantillas Maestras):</strong>
<ul>
<li data-marpit-fragment="1"><strong>Qué guardar:</strong> Logos oficiales, formatos vacíos de presupuestos (Excel), formatos de check-in de voluntarios, machotes de contratos.</li>
<li data-marpit-fragment="2"><strong>Permisos (Crucial):</strong> Solo el equipo central (Owners) tiene permiso de <em>Edición</em>. Todos los demás voluntarios tienen permiso de <em>Lectura</em> (solo pueden descargar o copiar).</li>
</ul>
</li>
<li><strong>&quot;Global Policies &amp; Manuals&quot; (Políticas Globales):</strong>
<ul>
<li data-marpit-fragment="3"><strong>Qué guardar:</strong> Manuales de respuesta a emergencias, guías de código de vestimenta, protocolos de seguridad.</li>
<li data-marpit-fragment="4"><strong>Permisos:</strong> Igual que arriba, 100% de Lectura para la mayoría.</li>
</ul>
</li>
</ol>
<h3 id="beneficio-1">Beneficio:</h3>
<p>Si en 2025 cambias el logo de la organización, solo actualizas el archivo en la carpeta &quot;Master Templates&quot; del Hub. Cuando los voluntarios de un evento vayan a buscar el logo, siempre descargarán la versión más nueva, sin que tengas que avisarles a todos.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="90" data-marpit-fragments="4" lang="en-US">
<h2 id="2-los-event-sites-espacios-de-trabajo-working-documents-1">2. Los Event Sites: Espacios de Trabajo (Working Documents)</h2>
<p>Cada sitio de evento individual (Ej: <code>The Walk 2024</code>) viene por defecto con una biblioteca llamada <strong>&quot;Documents&quot;</strong> (Documentos). Ese es el espacio de trabajo activo.</p>
<h3 id="%C2%BFqu%C3%A9-se-guarda-en-el-sitio-del-evento-1">¿Qué se guarda en el Sitio del Evento?</h3>
<ul>
<li data-marpit-fragment="1">Contratos de proveedores <strong>ya firmados</strong> para <em>ese</em> evento.</li>
<li data-marpit-fragment="2">Presentaciones de PowerPoint específicas para <em>esa</em> junta de comité.</li>
<li data-marpit-fragment="3">El plano de mesas (Layout) del salón de <em>ese</em> año.</li>
</ul>
<h3 id="permisos-1">Permisos:</h3>
<ul>
<li data-marpit-fragment="4">Todos los miembros del comité del evento tienen permisos para <strong>Editar, Borrar y Crear</strong> la biblioteca de su sitio. Es su espacio de trabajo.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="91" lang="en-US">
<h2 id="3-%C2%BFc%C3%B3mo-conectar-ambos-mundos-flujo-de-trabajo-del-usuario-1">3. ¿Cómo Conectar Ambos Mundos? (Flujo de Trabajo del Usuario)</h2>
<p>Para que los voluntarios no se frustren buscando la &quot;Plantilla de Check-in&quot;, debes hacer que fluya de manera natural desde el Hub hacia el Sitio del Evento.</p>
<h3 id="la-funci%C3%B3n-m%C3%A1gica-colocar-un-acceso-directo-add-shortcut-1">La Función Mágica: &quot;Colocar un Acceso Directo&quot; (Add shortcut)</h3>
<ol>
<li>Ve a la biblioteca &quot;Master Templates&quot; de tu Hub Site.</li>
<li>Selecciona la carpeta de plantillas.</li>
<li>Copia el <strong>enlace (URL)</strong> de esa biblioteca.</li>
<li>En tu sitio de evento, puedes agregar ese enlace como un acceso directo (Quick Link) o en el menú izquierdo de navegación.</li>
</ol>
<h3 id="m%C3%A9todo-copy-to-recomendado-para-sharepoint-moderno-1">Método &quot;Copy to&quot; (Recomendado para SharePoint Moderno)</h3>
<p>La mejor manera de trabajar es enseñar a los voluntarios este flujo:</p>
<ol>
<li>El voluntario entra al <strong>Hub Site</strong>.</li>
<li>Entra a la biblioteca <strong>Master Templates</strong>.</li>
<li>Selecciona el formato vacío (ej: <code>Formato-CheckIn-Vacio.xlsx</code>).</li>
<li>Haz clic en el botón superior que dice <strong>&quot;Copy to&quot;</strong> (Copiar a).</li>
<li>SharePoint le preguntará &quot;¿A dónde lo quieres copiar?&quot;. El voluntario selecciona su sitio de evento activo (Ej: <code>The Walk 2024</code> -&gt; <code>Documents</code>).</li>
<li><strong>Magia:</strong> El documento vacío se copia al sitio del evento, donde el voluntario ya puede llenarlo con nombres sin afectar la plantilla maestra del Hub.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="92" data-marpit-fragments="6" lang="en-US">
<h2 id="4-mejora-continua-actualizando-plantillas-1">4. Mejora Continua: Actualizando Plantillas</h2>
<p>¿Qué pasa si un voluntario del evento &quot;The Walk 2024&quot; mejora la plantilla del presupuesto agregando fórmulas increíbles?</p>
<ul>
<li data-marpit-fragment="1">Esa mejora se queda en su sitio de evento.</li>
<li data-marpit-fragment="2">Te envía un correo diciendo: &quot;Oye, mejoré el formato de presupuesto, ¿lo puedes hacer el oficial?&quot;.</li>
<li data-marpit-fragment="3">Tú (como Owner del Hub) vas a tu computadora, descargas el formato mejorado, y <strong>lo subes a la biblioteca &quot;Master Templates&quot; del Hub</strong> reemplazando el viejo.</li>
<li data-marpit-fragment="4">¡Listo! El próximo evento (Ej: Gala 2024) ya usará el formato mejorado cuando le den &quot;Copy to&quot;.</li>
</ul>
<h3 id="%F0%9F%93%82-relacionado-7"><img class="emoji" draggable="false" alt="📂" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c2.svg" data-marp-twemoji=""/> Relacionado</h3>
<ul>
<li data-marpit-fragment="5">[[05-Plan-Gobernanza-Datos|Plan de control de versiones y permisos]]</li>
<li data-marpit-fragment="6">[[06-Estrategia-Reutilizacion-Anual|Qué hacer con los documentos de eventos pasados]]</li>
</ul>
<h1 id="configuraci%C3%B3n-centralizada-del-hub-site-gu%C3%ADa-de-contenido-1">Configuración Centralizada del Hub Site (Guía de Contenido)</h1>
<p>Para mantener la consistencia con tu &quot;Ultimate English Site Script&quot; (V5), el Hub Site central (<code>Event Planning Improvements Project</code>) debe estar estructurado y nombrado completamente en Inglés para los elementos del sistema, aunque las descripciones estén en Español.</p>
<p>Aquí tienes el blueprint exacto de qué crear en el Hub Site, incluyendo nombres de bibliotecas, estructuras de carpetas y plantillas esenciales.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="93" data-marpit-fragments="42" lang="en-US">
<h2 id="1-bibliotecas-de-documentos-a-crear-1">1. Bibliotecas de Documentos a Crear</h2>
<p>No uses la biblioteca por defecto &quot;Documents&quot; para todo. Segrega tus archivos creando estas bibliotecas específicas en el Hub Site (Icono Engrane -&gt; Add an App -&gt; Document Library).</p>
<h3 id="library-a-master-templates-1">Library A: <code>Master Templates</code></h3>
<p><strong>Propósito:</strong> Hogar de todos los archivos en blanco y reutilizables.<br />
<strong>Permisos:</strong> Owners (Edit), Members/Visitors (Read-Only).</p>
<p><strong>Estructura Completa de Carpetas dentro de <code>Master Templates</code>:</strong></p>
<ul>
<li data-marpit-fragment="1">
<p><code>01 - Finance &amp; Budget</code></p>
<ul>
<li data-marpit-fragment="2"><code>Event-Budget-Blank-Template.xlsx</code></li>
<li data-marpit-fragment="3"><code>Vendor-Invoice-Cover-Sheet.docx</code></li>
<li data-marpit-fragment="4"><code>Reimbursement-Request-Form.pdf</code></li>
<li data-marpit-fragment="5"><code>Sponsorship-Pitch-Deck.pptx</code></li>
<li data-marpit-fragment="6"><code>Sponsorship-Pricing-Tiers.pdf</code></li>
<li data-marpit-fragment="7"><code>Tax-Exemption-Certificate.pdf</code></li>
</ul>
</li>
<li data-marpit-fragment="8">
<p><code>02 - Operations &amp; Logistics</code></p>
<ul>
<li data-marpit-fragment="9"><code>Volunteer-Check-In-Sheet.xlsx</code></li>
<li data-marpit-fragment="10"><code>Event-Run-of-Show-Template.docx</code></li>
<li data-marpit-fragment="11"><code>Venue-Inspection-Checklist.pdf</code></li>
<li data-marpit-fragment="12"><code>Equipment-Inventory-Tracker.xlsx</code></li>
<li data-marpit-fragment="13"><code>Catering-Menu-Template.docx</code></li>
<li data-marpit-fragment="14"><code>Event-Debrief-Meeting-Agenda.docx</code></li>
</ul>
</li>
<li data-marpit-fragment="15">
<p><code>03 - Marketing &amp; Branding</code></p>
<ul>
<li data-marpit-fragment="16"><code>Casa-Familiar-Official-Logos.zip</code></li>
<li data-marpit-fragment="17"><code>Press-Release-Template.docx</code></li>
<li data-marpit-fragment="18"><code>Social-Media-Graphics-Base.pptx</code></li>
<li data-marpit-fragment="19"><code>Typography-and-Brand-Colors.pdf</code></li>
<li data-marpit-fragment="20"><code>Email-Newsletter-Template.docx</code></li>
<li data-marpit-fragment="21"><code>Event-Flyer-Template.dotx</code></li>
</ul>
</li>
<li data-marpit-fragment="22">
<p><code>04 - Legal &amp; Contracts</code></p>
<ul>
<li data-marpit-fragment="23"><code>Standard-Vendor-Agreement.docx</code></li>
<li data-marpit-fragment="24"><code>Liability-Waiver-Form.pdf</code></li>
<li data-marpit-fragment="25"><code>Photo-Release-Consent-Form.pdf</code></li>
<li data-marpit-fragment="26"><code>Talent-Performer-Agreement.docx</code></li>
<li data-marpit-fragment="27"><code>Non-Disclosure-Agreement-NDA.pdf</code></li>
</ul>
</li>
<li data-marpit-fragment="28">
<p><code>05 - Risk &amp; Safety Management</code></p>
<ul>
<li data-marpit-fragment="29"><code>Risk-Assessment-Matrix-Blank.xlsx</code></li>
<li data-marpit-fragment="30"><code>Incident-Report-Form.pdf</code></li>
<li data-marpit-fragment="31"><code>Emergency-Contact-List-Template.xlsx</code></li>
</ul>
</li>
<li data-marpit-fragment="32">
<p><code>06 - Committee &amp; Volunteers</code></p>
<ul>
<li data-marpit-fragment="33"><code>Committee-Meeting-Minutes-Template.docx</code></li>
<li data-marpit-fragment="34"><code>Volunteer-Role-Descriptions.pdf</code></li>
<li data-marpit-fragment="35"><code>Certificate-of-Appreciation-Template.pptx</code></li>
</ul>
</li>
</ul>
<h3 id="library-b-global-policies--procedures-1">Library B: <code>Global Policies &amp; Procedures</code></h3>
<p><strong>Propósito:</strong> Reglas y manuales oficiales que no cambian de evento en evento.<br />
<strong>Permisos:</strong> Owners (Edit), Members/Visitors (Read-Only).</p>
<p><strong>Contenido Recomendado (Sin carpetas, mantener plano para facilitar búsquedas):</strong></p>
<ul>
<li data-marpit-fragment="36"><code>Emergency-Response-Protocol.pdf</code></li>
<li data-marpit-fragment="37"><code>Volunteer-Code-of-Conduct.pdf</code></li>
<li data-marpit-fragment="38"><code>Expense-Approval-Policy.pdf</code></li>

<li data-marpit-fragment="40"><code>Vendor-Onboarding-Process.pdf</code></li>

<li data-marpit-fragment="42"><code>Event-Cancellation-Policy.pdf</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="94" data-marpit-fragments="23" lang="en-US">
<h2 id="2-navegaci%C3%B3n-del-hub-site-megamenu-1">2. Navegación del Hub Site (MegaMenu)</h2>
<p>El Hub utiliza el layout de MegaMenu para mostrar un directorio completo de recursos.</p>
<p><strong>Estructura Extendida del Menú (Inglés para los Enlaces):</strong></p>

</ul>
</li>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="95" data-marpit-fragments="7" lang="en-US">
<h2 id="3-dise%C3%B1o-de-la-p%C3%A1gina-principal-del-hub-web-parts-1">3. Diseño de la Página Principal del Hub (Web Parts)</h2>
<p>La Home page del Hub Site no debe mostrar tareas (eso pertenece a los sitios de eventos). Debe actuar como un panel para toda la organización.</p>
<p><strong>Web Parts Recomendados (De arriba a abajo):</strong></p>
<ol>
<li><strong>Hero Web Part:</strong>
<ul>
<li data-marpit-fragment="1"><em>Título:</em> &quot;Welcome to Casa Familiar Event Planning&quot;</li>
<li data-marpit-fragment="2"><em>Botón de Llamado a la Acción:</em> &quot;Go to Current Event: The Walk 2024&quot; (Se actualiza anualmente).</li>
</ul>
</li>
<li><strong>Quick Links Web Part (Layout de Iconos):</strong>
<ul>
<li data-marpit-fragment="3">Link 1: Download Official Logos</li>
<li data-marpit-fragment="4">Link 2: View Emergency Protocols</li>
<li data-marpit-fragment="5">Link 3: Submit Reimbursement</li>
</ul>
</li>
<li><strong>News Web Part:</strong>
<ul>
<li data-marpit-fragment="6">Úsalo para publicar anuncios organizacionales (ej: &quot;New Catering Vendor Approved&quot;, &quot;Gala Date Moved&quot;).</li>
</ul>
</li>
<li><strong>Events Web Part:</strong>
<ul>
<li data-marpit-fragment="7">Consolida fechas de calendario de todos los Event Sites conectados para mostrar una línea de tiempo unificada.</li>
</ul>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="96" lang="en-US">
<h2 id="4-recordatorio-del-flujo-de-trabajo-1">4. Recordatorio del Flujo de Trabajo</h2>
<p><strong>Siempre entrena al personal con esta regla:</strong><br />
<em>&quot;Nunca edites un archivo directamente en la biblioteca <code>Master Templates</code>. Abre la carpeta, selecciona el archivo, haz clic en <strong>Copy to</strong> en el menú superior, y envíalo a la biblioteca de documentos de tu sitio de evento específico antes de llenarlo.&quot;</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="97" data-marpit-fragments="2" lang="en-US">
<h3 id="relacionado-6">Relacionado</h3>
<ul>
<li data-marpit-fragment="1">[[07-Estrategia-Archivos-Centralizados|Por qué centralizamos archivos (Estrategia)]]</li>
<li data-marpit-fragment="2">[[04h-Site-Script|La plantilla usada para los Sitios de Eventos]]</li>
</ul>
<h1 id="estructura-de-carpetas-operativas-para-sitios-de-eventos-1">Estructura de Carpetas Operativas para Sitios de Eventos</h1>
<p>Mientras que el Hub Site contiene las <strong>Master Templates</strong>, cada sitio de evento individual (ej: <em>The Walk 2024</em>) necesita una estructura operativa para almacenar sus archivos de trabajo específicos, contratos firmados y activos del día del evento.</p>
<p>La consistencia en todos los sitios de eventos es clave para facilitar los reportes y la rotación del personal.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="98" data-marpit-fragments="18" lang="en-US">
<h2 id="1-recomendaciones-para-la-biblioteca-documents-1">1. Recomendaciones para la Biblioteca &quot;Documents&quot;</h2>
<p>Cada sitio de evento creado con la plantilla &quot;Casa Familiar - Full Event Setup&quot; tendrá una biblioteca por defecto llamada <strong>Documents</strong>. Esta debe organizarse de la siguiente manera:</p>
<h3 id="estructura-sugerida-de-carpetas-ingl%C3%A9s-1">Estructura Sugerida de Carpetas (Inglés):</h3>
<ul>
<li data-marpit-fragment="1"><code>01 - Financials &amp; Expenses</code>
<ul>
<li data-marpit-fragment="2"><em>Propósito:</em> Presupuesto llenado localmente, cotizaciones de vendors y facturas específicas.</li>
<li data-marpit-fragment="3"><em>Contenido:</em> <code>TheWalk2024-Final-Budget.xlsx</code>, <code>Catering-Invoice-001.pdf</code>.</li>
</ul>
</li>
<li data-marpit-fragment="4"><code>02 - Planning &amp; Logistics</code>
<ul>
<li data-marpit-fragment="5"><em>Propósito:</em> Planes operativos, run-of-shows y planos del lugar.</li>
<li data-marpit-fragment="6"><em>Contenido:</em> <code>Event-Schedule-V3.docx</code>, <code>Venue-Layout-Map.png</code>.</li>
</ul>
</li>
<li data-marpit-fragment="7"><code>03 - Marketing &amp; Social Media</code>
<ul>
<li data-marpit-fragment="8"><em>Propósito:</em> Flyers específicos para este año, fotos del evento y comunicados de prensa localizados.</li>
<li data-marpit-fragment="9"><em>Contenido:</em> <code>Social-Media-Photos/</code>, <code>TheWalk2024-Campaign-Flyer.pdf</code>.</li>
</ul>
</li>
<li data-marpit-fragment="10"><code>04 - Signed Contracts &amp; Agreements</code>
<ul>
<li data-marpit-fragment="11"><em>Propósito:</em> Versiones finales y firmadas de documentos (Mover desde el template del Hub -&gt; Llenar -&gt; Firmar -&gt; Almacenar aquí).</li>
<li data-marpit-fragment="12"><em>Contenido:</em> <code>Signed-Security-Contract.pdf</code>, <code>Talent-Waivers/</code>.</li>
</ul>
</li>
<li data-marpit-fragment="13"><code>05 - Volunteer &amp; Staff Management</code>
<ul>
<li data-marpit-fragment="14"><em>Propósito:</em> Horarios de turnos, listas de contactos específicas para este equipo.</li>
<li data-marpit-fragment="15"><em>Contenido:</em> <code>Shift-Schedule-Final.xlsx</code>, <code>Staff-Instructions.pdf</code>.</li>
</ul>
</li>
<li data-marpit-fragment="16"><code>06 - Post-Event &amp; Debrief</code>
<ul>
<li data-marpit-fragment="17"><em>Propósito:</em> Reportes resumidos, resultados de encuestas y lecciones aprendidas.</li>
<li data-marpit-fragment="18"><em>Contenido:</em> <code>Post-Event-Report.docx</code>, <code>Survey-Results-Summary.xlsx</code>.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="99" lang="en-US">
<h2 id="2-mejores-pr%C3%A1cticas-para-due%C3%B1os-de-sitios-1">2. Mejores Prácticas para Dueños de Sitios</h2>
<ol>
<li><strong>No crees carpetas de primer nivel:</strong> Mantente fiel a las 6 categorías estándar de arriba.</li>
<li><strong>Convención de Nombres:</strong> Prefija los archivos con el Nombre del Evento y Año (ej: <code>Gala2024-GuestList.xlsx</code>) para que, si alguna vez se mueven o comparten, el contexto permanezca.</li>
<li><strong>Usa el Hub:</strong> Si necesitas un formulario &quot;en blanco&quot;, ve a la biblioteca <code>Master Templates</code> del Hub y usa la función <strong>&quot;Copy to&quot;</strong> para traerlo aquí.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="100" lang="en-US">
<h2 id="3-automatizaci%C3%B3n-creaci%C3%B3n-program%C3%A1tica-1">3. Automatización (Creación Programática)</h2>
<p>Dado que los Site Scripts de SharePoint aún no soportan de forma nativa la creación de estructuras de carpetas complejas, se recomienda que el <strong>Dueño del Sitio</strong> o <strong>Administrador de TI</strong> ejecute el script <code>create-event-folders.ps1</code> inmediatamente después de que se aprovisione un nuevo sitio de evento.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="101" data-marpit-fragments="2" lang="en-US">
